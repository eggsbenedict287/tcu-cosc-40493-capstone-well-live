spring:
  application:
    name: well-live-backend
  profiles:
    default: local
  datasource:
    url: jdbc:h2:mem:welllive;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: false
  jackson:
    default-property-inclusion: non_null
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
app:
  security:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:8100}
    csrf-cookie-secure: ${SESSION_COOKIE_SECURE:false}
    terms-version: ${TERMS_VERSION:v1}
  assessment:
    enabled: ${ASSESSMENT_ENABLED:true}
    encryption-key: ${ASSESSMENT_ENCRYPTION_KEY}
